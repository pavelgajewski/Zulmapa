name: Odśwież dane OSM

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-data.yml"
  schedule:
    - cron: "23 4 * * 1"   # poniedziałek 04:23 UTC, co tydzień
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz dane z Overpass i Nominatim
        run: node scripts/fetch_data.mjs
      - name: Commit paczek danych na najnowszy main (tylko gdy coś się zmieniło)
        run: |
          git config user.name "zulmapa-bot"
          git config user.email "actions@users.noreply.github.com"
          cp -r data "$RUNNER_TEMP/newdata"
          for i in 1 2 3; do
            git fetch -q origin main
            git checkout -q -f -B main origin/main
            rm -rf data && cp -r "$RUNNER_TEMP/newdata" data
            git add data
            if git diff --cached --quiet; then echo "Bez zmian w danych"; exit 0; fi
            git commit -q -m "data: odświeżenie paczek OSM [skip ci]"
            git push -q origin main && exit 0
            echo "Push odrzucony (main się zmienił), próba $i"; sleep 5
          done
          exit 1
